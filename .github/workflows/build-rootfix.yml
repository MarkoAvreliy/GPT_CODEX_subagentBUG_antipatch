name: Build consolidated Codex lifecycle root-fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - patches/consolidated-lifecycle-fix-2026-08-08.patch
      - .github/workflows/build-rootfix.yml

permissions:
  contents: read

jobs:
  test-and-build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out patch checkpoint
        uses: actions/checkout@v4

      - name: Check out pinned OpenAI Codex source
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: 618b8e9111da9f57fe380b09d0f6516e3f343536
          path: upstream-codex

      - name: Apply consolidated lifecycle patch
        shell: pwsh
        run: |
          git -C upstream-codex apply --check --whitespace=error-all ../patches/consolidated-lifecycle-fix-2026-08-08.patch
          git -C upstream-codex apply ../patches/consolidated-lifecycle-fix-2026-08-08.patch

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream-codex/codex-rs

      - name: Check patched core
        working-directory: upstream-codex/codex-rs
        run: cargo check -p codex-core --lib

      - name: Test terminal lifecycle repair
        working-directory: upstream-codex/codex-rs
        env:
          RUST_MIN_STACK: "8388608"
        run: |
          cargo test -p codex-core completed_agent_runtime_unloads_but_terminal_status_remains_observable
          cargo test -p codex-core residency_slot_reservation_unloads_oldest_idle_v2_agent
          cargo test -p codex-core resume_agent_from_rollout_does_not_reopen_v2_descendants
          cargo test -p codex-core completed_legacy_child_is_repaired_without_resuming_runtime

      - name: Test lazy history and first-turn MCP activation
        working-directory: upstream-codex/codex-rs
        env:
          RUST_MIN_STACK: "8388608"
        run: |
          cargo build -p codex-rmcp-client --bin test_stdio_server
          $env:CARGO_BIN_EXE_test_stdio_server = (Resolve-Path '.\target\debug\test_stdio_server.exe').Path
          cargo test -p codex-app-server lazy_thread_resume_ -- --nocapture

      - name: Build patched Codex executable
        working-directory: upstream-codex/codex-rs
        run: cargo build --release -p codex-cli --bin codex

      - name: Upload testable executable
        uses: actions/upload-artifact@v4
        with:
          name: codex-lifecycle-rootfix-windows-x64
          path: upstream-codex/codex-rs/target/release/codex.exe
          if-no-files-found: error
          retention-days: 7
